<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permanecer</title>
  <style>
    @font-face {
      font-family: 'VeteranTypewriter';
      src: url('fonts/veteran typewriter.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'VeteranTypewriter', serif;
      background-color: #ffffff;
      transition: background-color 4s ease;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 1;
      transition: opacity 4s ease;
      pointer-events: none;
      z-index: 100;
    }
    nav { text-align: center; }
    ul { list-style: none; padding: 0; }
    ul li { margin: 1.2rem 0; }
    ul li a {
      font-size: 2rem;
      font-weight: 300;
      color: rgba(30,28,25,0.75);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: opacity 0.3s;
    }
    ul li a:hover { opacity: 0.5; }
  </style>
</head>
<body>
<div id="flash"></div>
<nav>
  <ul>
    <li><a href="reter/">Reter</a></li>
    <li><a href="conservar/">Conservar</a></li>
    <li><a href="sustentar/">Sustentar</a></li>
    <li><a href="soltar/">Soltar</a></li>
  </ul>
</nav>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  const cor = cores[Math.floor(Math.random() * cores.length)];
  document.body.style.backgroundColor = cor;

  const flash = document.getElementById('flash');

  document.fonts.ready.then(() => {
    requestAnimationFrame(() => flash.style.opacity = '0');
  });

  document.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      const href = this.href;
      flash.style.transition = 'opacity 4s ease';
      flash.style.opacity = '1';
      setTimeout(() => window.location.href = href, 4000);
    });
  });
</script>
</body>
</html>
