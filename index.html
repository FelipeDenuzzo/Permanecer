<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permanecer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      opacity: 0;
      transition: opacity 4s ease;
    }
    body.visivel { opacity: 1; }
    nav { text-align: center; }
    ul { list-style: none; padding: 0; }
    ul li { margin: 1.2rem 0; }
    ul li a {
      font-size: 2rem;
      font-weight: 300;
      color: rgba(30,28,25,0.75);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: opacity 0.3s;
    }
    ul li a:hover { opacity: 0.5; }
  </style>
</head>
<body>
<nav>
  <ul>
    <li><a href="reter/">Reter</a></li>
  </ul>
</nav>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  // Fade-in
  requestAnimationFrame(() => document.body.classList.add('visivel'));

  // Fade-out ao sair
  document.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      const href = this.href;
      document.body.classList.remove('visivel');
      setTimeout(() => window.location.href = href, 4000);
    });
  });
</script>
</body>
</html>
