<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permanecer</title>
  <style>
    @font-face {
      font-family: 'VeteranTypewriter';
      src: url('fonts/veteran typewriter.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'VeteranTypewriter', serif;
      background-color: #ffffff;
      transition: background-color 4s ease;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 1;
      transition: opacity 4s ease;
      pointer-events: none;
      z-index: 100;
    }
    /* container geral levemente acima do centro */
    #main {
      text-align: center;
      margin-top: -6vh;
    }
    #header {
      text-align: center;
      margin-bottom: 2.2rem;
      opacity: 0;
      transition: opacity 7s ease;
    }
    #header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: rgba(30,28,25,0.80);
      margin-bottom: 0.45rem;
    }
    #header p {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: rgba(30,28,25,0.45);
      font-weight: 300;
    }
    nav { text-align: center; }
    ul { list-style: none; padding: 0; }
    ul li { margin: 0.95rem 0; }
    ul li a {
      font-size: 1.7rem;
      font-weight: 300;
      color: rgba(30,28,25,0.75);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: opacity 0.3s;
    }
    ul li a:hover { opacity: 0.5; }
    #mute-btn {
      position: fixed;
      top: 1.4rem;
      right: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: rgba(30,28,25,0.35);
      z-index: 200;
      padding: 0.5rem;
      transition: opacity 0.3s;
    }
    #mute-btn:hover { opacity: 0.15; }
  </style>
</head>
<body>
<div id="flash"></div>
<button id="mute-btn" title="silenciar">&#9834;</button>
<div id="main">
  <div id="header">
    <h1>Permanecer</h1>
    <p>sil&#234;ncio entre presen&#231;a e toque</p>
  </div>
  <nav>
    <ul>
      <li><a href="reter/">Reter</a></li>
      <li><a href="conservar/">Conservar</a></li>
      <li><a href="sustentar/">Sustentar</a></li>
      <li><a href="soltar/">Soltar</a></li>
      <li><a href="atravessar/">Atravessar</a></li>
      <li><a href="esperar/">Esperar</a></li>
    </ul>
  </nav>
</div>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  const cor = cores[Math.floor(Math.random() * cores.length)];
  document.body.style.backgroundColor = cor;

  const flash  = document.getElementById('flash');
  const header = document.getElementById('header');

  const TRACKS = ['audio/1.AAC','audio/2.AAC','audio/3.AAC','audio/4.AAC','audio/5.AAC'];
  let lastTrack = -1;
  let muted = false;
  const audio = new Audio();
  audio.volume = 1;

  function pickTrack() {
    let idx;
    do { idx = Math.floor(Math.random() * TRACKS.length); } while (idx === lastTrack && TRACKS.length > 1);
    lastTrack = idx;
    return TRACKS[idx];
  }
  function playNext() {
    audio.src = pickTrack();
    audio.volume = muted ? 0 : 1;
    audio.play().catch(() => {});
  }
  audio.addEventListener('ended', playNext);
  document.addEventListener('click', function startAudio() {
    if (audio.paused) playNext();
    document.removeEventListener('click', startAudio);
  }, { once: true });

  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    audio.volume = muted ? 0 : 1;
    muteBtn.textContent = muted ? '\u266f' : '\u266a';
    muteBtn.style.opacity = muted ? '0.18' : '';
  });

  function fadeOutAudio() {
    const steps = 40, duration = 2000, interval = duration / steps;
    const volStep = audio.volume / steps;
    let s = 0;
    const t = setInterval(() => {
      s++;
      audio.volume = Math.max(0, audio.volume - volStep);
      if (s >= steps) clearInterval(t);
    }, interval);
  }

  document.fonts.ready.then(() => {
    requestAnimationFrame(() => {
      flash.style.opacity = '0';
      setTimeout(() => { header.style.opacity = '1'; }, 1000);
    });
  });

  document.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      const href = this.href;
      header.style.transition = 'opacity 4s ease';
      header.style.opacity = '0';
      flash.style.transition = 'opacity 4s ease';
      flash.style.opacity = '1';
      if (!muted) fadeOutAudio();
      setTimeout(() => window.location.href = href, 4000);
    });
  });
</script>
</body>
</html>
