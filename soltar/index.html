<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soltar</title>
  <style>
    @font-face {
      font-family: 'VeteranTypewriter';
      src: url('../fonts/veteran typewriter.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #ffffff;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 1;
      transition: opacity 4s ease;
      pointer-events: none;
      z-index: 100;
    }
    #voltar {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.85rem;
      color: rgba(30,28,25,0.5);
      text-decoration: none;
      letter-spacing: 0.1em;
      z-index: 200;
      padding: 1rem 1.5rem;
    }
    #voltar:hover { opacity: 0.3; }
  </style>
</head>
<body>
<div id="flash"></div>
<canvas id="c"></canvas>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const flash = document.getElementById('flash');
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const voltar = document.getElementById('voltar');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ── parâmetros ────────────────────────────────────────────────────────────
  const N            = 10;     // quantidade de círculos
  const TOTAL_TIME   = 29;     // segundos para todos abrirem completamente
  const COUNT_START  = 30;     // contagem exibida ao iniciar

  // Cada círculo abre em sequência, do menor (interno) ao maior (externo).
  // O tempo total é dividido igualmente: cada um ocupa TOTAL_TIME / N segundos.
  const STEP_TIME = TOTAL_TIME / N;  // ~2.9s por círculo

  // raio externo do conjunto (% do menor lado da tela)
  function outerR() { return Math.min(canvas.width, canvas.height) * 0.38; }
  // espaço central livre para a contagem
  function innerR() { return outerR() * 0.18; }

  // raios de cada círculo: do maior (i=0) ao menor (i=9)
  // círculo i=0 → externo; i=9 → interno
  function ringRadius(i) {
    const rOuter = outerR();
    const rInner = innerR();
    // distribui linearmente do externo ao interno
    return rOuter - (rOuter - rInner) * (i / (N - 1));
  }

  // ── estado ────────────────────────────────────────────────────────────────
  let pressed  = false;
  let openTime = 0;   // segundos de abertura acumulados (0..TOTAL_TIME)
  let count    = COUNT_START;
  let leaving  = false;

  // ── abertura de cada círculo ──────────────────────────────────────────────
  // openTime 0..STEP_TIME  → círculo 9 (menor, interno) abrindo
  // openTime STEP_TIME..2*STEP_TIME → círculo 8 abrindo
  // ...
  // openTime (N-1)*STEP_TIME..N*STEP_TIME → círculo 0 (maior) abrindo
  //
  // Índice do círculo em abertura: do menor (9) ao maior (0)
  // ringIndex em abertura = N - 1 - Math.floor(openTime / STEP_TIME)
  //
  // abertura: o arco vai de círculo fechado (2π) → meio-círculo (π)
  // cada círculo alterna o lado de abertura:
  //   círculo par  → abre retirando o semicírculo superior (de π a 2π fica a base)
  //   círculo ímpar → abre retirando o semicírculo inferior
  // na prática: arc de startAngle a startAngle + openArc
  //   fechado  → openArc = 2π
  //   aberto   → openArc = π

  function getArcForRing(ringIdx) {
    // ringIdx: 0 = externo, 9 = interno
    // ordem de abertura: 9 → 0
    const orderIdx = N - 1 - ringIdx;  // 0 = abre primeiro (anel 9), 9 = abre por último (anel 0)
    const tStart = orderIdx * STEP_TIME;
    const tEnd   = tStart + STEP_TIME;

    let progress = 0;
    if (openTime >= tEnd)        progress = 1;
    else if (openTime > tStart)  progress = (openTime - tStart) / STEP_TIME;

    // easing suave
    const eased = progress < 0.5
      ? 2 * progress * progress
      : -1 + (4 - 2 * progress) * progress;

    // arco: fecha = 2π, abre = π
    const arcSpan = Math.PI * 2 - Math.PI * eased; // de 2π (fechado) até π (meio)

    // direção alternada: anel par abre para a esquerda, ímpar para a direita
    // startAngle define de onde o arco começa
    let startAngle;
    if (ringIdx % 2 === 0) {
      // abre retirando a metade superior → arco começa em baixo
      startAngle = Math.PI / 2;
    } else {
      // abre retirando a metade inferior → arco começa em cima
      startAngle = -Math.PI / 2;
    }

    return { startAngle, arcSpan };
  }

  // ── saída ─────────────────────────────────────────────────────────────────
  function triggerExit(href) {
    if (leaving) return;
    leaving = true;
    flash.style.opacity = '1';
    setTimeout(() => window.location.href = href, 4000);
  }

  function isOnVoltar(x, y) {
    const r = voltar.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  // ── loop ──────────────────────────────────────────────────────────────────
  let lastTick = null;

  function loop(ts) {
    if (!lastTick) lastTick = ts;
    const delta = (ts - lastTick) / 1000;  // segundos
    lastTick = ts;

    if (pressed) {
      openTime = Math.min(TOTAL_TIME, openTime + delta);
      count    = Math.max(0, count - delta);
      if (count <= 0) triggerExit('../');
    } else {
      // fecha suavemente ao soltar: retrocede em ~60% da velocidade de abertura
      openTime = Math.max(0, openTime - delta * 0.6);
      // contagem não volta atrás: permanece onde estava
    }

    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;

    ctx.strokeStyle = 'rgba(30,28,25,0.75)';
    ctx.lineWidth   = 1.2;
    ctx.lineCap     = 'round';

    // desenha do externo (0) ao interno (9)
    for (let i = 0; i < N; i++) {
      const r = ringRadius(i);
      const { startAngle, arcSpan } = getArcForRing(i);

      ctx.beginPath();
      ctx.arc(cx, cy, r, startAngle, startAngle + arcSpan);
      ctx.stroke();
    }

    // contagem no centro
    if (count < COUNT_START) {
      ctx.save();
      ctx.fillStyle = 'rgba(30,28,25,0.75)';
      ctx.font = `1.6rem "VeteranTypewriter", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(count), cx, cy);
      ctx.restore();
    }
  }

  // ── eventos ───────────────────────────────────────────────────────────────
  function onStart(x, y) {
    if (leaving) return;
    if (isOnVoltar(x, y)) { triggerExit('../'); return; }
    pressed = true;
  }
  function onEnd() { pressed = false; }

  canvas.addEventListener('mousedown',  e => onStart(e.clientX, e.clientY));
  document.addEventListener('mouseup',  onEnd);
  document.addEventListener('mouseleave', onEnd);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchend',    e => { e.preventDefault(); onEnd(); }, { passive: false });
  canvas.addEventListener('touchcancel', onEnd);

  voltar.addEventListener('click', e => { e.preventDefault(); triggerExit('../'); });

  document.fonts.ready.then(() => {
    requestAnimationFrame(loop);
    requestAnimationFrame(() => flash.style.opacity = '0');
  });
</script>
</body>
</html>
