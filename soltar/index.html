<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soltar</title>
  <style>
    @font-face {
      font-family: 'VeteranTypewriter';
      src: url('../fonts/veteran typewriter.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #ffffff;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 1;
      transition: opacity 4s ease;
      pointer-events: none;
      z-index: 100;
    }
    #quote {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'VeteranTypewriter', serif;
      color: rgba(30,28,25,0.75);
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      white-space: normal;
      width: 80vw;
      max-width: 360px;
      z-index: 50;
    }
    #quote .frase {
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      line-height: 1.5;
      display: block;
      margin-bottom: 0.4rem;
    }
    #quote .autor {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      opacity: 0.6;
      display: block;
    }
    #voltar {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.85rem;
      color: rgba(30,28,25,0.5);
      text-decoration: none;
      letter-spacing: 0.1em;
      z-index: 200;
      padding: 1rem 1.5rem;
    }
    #voltar:hover { opacity: 0.3; }
  </style>
</head>
<body>
<div id="flash"></div>
<canvas id="c"></canvas>
<div id="quote">
  <span class="frase"></span>
  <span class="autor"></span>
</div>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const frases = [
    {
      html: '\u201cN\u00e3o podemos nos curar daquilo<br>que n\u00e3o aceitamos<br>como parte de n\u00f3s mesmos.\u201d',
      autor: 'Sigmund Freud'
    },
    {
      html: '\u201cA l\u00edngua revela<br>o conte\u00fado do cora\u00e7\u00e3o.\u201d',
      autor: 'Emmanuel'
    },
    {
      html: '\u201cA vida s\u00e3o as incessantes oportunidades<br>que surgem pela frente,<br>jamais os insucessos<br>que ocorreram no passado.\u201d',
      autor: 'Joanna de \u00c2ngelis'
    },
  ];
  const escolha = frases[Math.floor(Math.random() * frases.length)];
  document.querySelector('#quote .frase').innerHTML = escolha.html;
  document.querySelector('#quote .autor').textContent = escolha.autor;

  const flash  = document.getElementById('flash');
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const voltar = document.getElementById('voltar');
  const quote  = document.getElementById('quote');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const N           = 10;
  const TOTAL_TIME  = 29;
  const COUNT_START = 30;
  const STEP_TIME   = TOTAL_TIME / N;
  const CLOSE_SPEED = 0.6;

  function outerR() { return Math.min(canvas.width, canvas.height) * 0.38; }
  function innerR() { return outerR() * 0.18; }

  function ringRadius(i) {
    return outerR() - (outerR() - innerR()) * (i / (N - 1));
  }

  let pressed  = false;
  let openTime = 0;
  let count    = COUNT_START;
  let leaving  = false;
  let quoteVisible = false;

  function updateQuote() {
    const shouldShow = (count <= 20 && count > 10);
    if (shouldShow && !quoteVisible) {
      quote.style.opacity = '1';
      quoteVisible = true;
    } else if (!shouldShow && quoteVisible) {
      quote.style.opacity = '0';
      quoteVisible = false;
    }
  }

  function getArcForRing(ringIdx) {
    const orderIdx = N - 1 - ringIdx;
    const tStart   = orderIdx * STEP_TIME;
    const tEnd     = tStart + STEP_TIME;

    let progress = 0;
    if (openTime >= tEnd)       progress = 1;
    else if (openTime > tStart) progress = (openTime - tStart) / STEP_TIME;

    const e = progress < 0.5
      ? 2 * progress * progress
      : -1 + (4 - 2 * progress) * progress;

    const startAngle = (-Math.PI / 2) * (1 - e);
    const arcSpan    = Math.PI * 2 - Math.PI * e;

    return { startAngle, arcSpan };
  }

  function triggerExit(href) {
    if (leaving) return;
    leaving = true;
    flash.style.opacity = '1';
    setTimeout(() => window.location.href = href, 4000);
  }

  function isOnVoltar(x, y) {
    const r = voltar.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  let lastTick = null;

  function loop(ts) {
    if (!lastTick) lastTick = ts;
    const delta = (ts - lastTick) / 1000;
    lastTick = ts;

    if (pressed) {
      openTime = Math.min(TOTAL_TIME, openTime + delta);
      count    = Math.max(0, count - delta);
      if (count <= 0) triggerExit('../');
    } else {
      openTime = Math.max(0, openTime - delta * CLOSE_SPEED);
      count    = Math.min(COUNT_START, count + delta * CLOSE_SPEED);
    }

    updateQuote();
    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width  / 2;
    const cy = canvas.height / 2;

    ctx.strokeStyle = 'rgba(30,28,25,0.75)';
    ctx.lineWidth   = 1.2;
    ctx.lineCap     = 'round';

    for (let i = 0; i < N; i++) {
      const r = ringRadius(i);
      const { startAngle, arcSpan } = getArcForRing(i);
      ctx.beginPath();
      ctx.arc(cx, cy, r, startAngle, startAngle + arcSpan);
      ctx.stroke();
    }

    if (count < COUNT_START) {
      ctx.save();
      ctx.fillStyle = 'rgba(30,28,25,0.75)';
      ctx.font = `1.6rem "VeteranTypewriter", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil(count), cx, cy);
      ctx.restore();
    }
  }

  function onStart(x, y) {
    if (leaving) return;
    if (isOnVoltar(x, y)) { triggerExit('../'); return; }
    pressed = true;
  }
  function onEnd() { pressed = false; }

  canvas.addEventListener('mousedown',    e => onStart(e.clientX, e.clientY));
  document.addEventListener('mouseup',    onEnd);
  document.addEventListener('mouseleave', onEnd);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchend',    e => { e.preventDefault(); onEnd(); }, { passive: false });
  canvas.addEventListener('touchcancel', onEnd);

  voltar.addEventListener('click', e => { e.preventDefault(); triggerExit('../'); });

  document.fonts.ready.then(() => {
    requestAnimationFrame(loop);
    requestAnimationFrame(() => flash.style.opacity = '0');
  });
</script>
</body>
</html>
