<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conservar</title>
  <style>
    @font-face { font-family: 'VeteranTypewriter'; src: url('../fonts/veteran typewriter.ttf') format('truetype'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; background-color: #ffffff; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; pointer-events: none; }
    #flash { position: fixed; inset: 0; background: #ffffff; opacity: 1; transition: opacity 4s ease; pointer-events: none; z-index: 100; }

    #intro {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 18vh;
      z-index: 80; cursor: pointer;
      opacity: 0; transition: opacity 2.5s ease;
    }
    #intro-text {
      font-family: 'VeteranTypewriter', serif;
      font-size: 1.05rem; font-weight: 300;
      letter-spacing: 0.13em; line-height: 2.2;
      color: rgba(30,28,25,0.70); text-align: center;
    }
    #intro-text span {
      display: block; opacity: 0; transform: translateY(6px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }
    #intro-hint {
      margin-top: 2.8rem;
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.65rem; letter-spacing: 0.22em;
      color: rgba(30,28,25,0.28);
      opacity: 0; transition: opacity 2s ease;
    }

    #quote { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); text-align: center; font-family: 'VeteranTypewriter', serif; color: rgba(30,28,25,0.75); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; white-space: normal; width: 80vw; max-width: 360px; z-index: 50; }
    #quote .frase { font-size: 0.9rem; letter-spacing: 0.06em; line-height: 1.5; display: block; margin-bottom: 0.4rem; }
    #quote .autor { font-size: 0.72rem; letter-spacing: 0.1em; opacity: 0.6; display: block; }
    #voltar { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); font-family: 'VeteranTypewriter', serif; font-size: 0.85rem; color: rgba(30,28,25,0.5); text-decoration: none; letter-spacing: 0.1em; z-index: 200; padding: 1rem 1.5rem; }
    #voltar:hover { opacity: 0.3; }
    #mute-btn { position: fixed; top: 1.4rem; right: 1.6rem; background: none; border: none; cursor: pointer; font-family: 'VeteranTypewriter', serif; font-size: 0.72rem; letter-spacing: 0.12em; color: rgba(30,28,25,0.35); z-index: 200; padding: 0.5rem; transition: opacity 0.3s; }
    #mute-btn:hover { opacity: 0.15; }
  </style>
</head>
<body>
<div id="flash"></div>
<button id="mute-btn" title="silenciar">&#9834;</button>

<div id="intro">
  <div id="intro-text">
    <span id="line1">Mantenha pressionado o que &#233; seu.</span>
    <span id="line2">Solte o que n&#227;o &#233;.</span>
  </div>
  <div id="intro-hint">toque para come&#231;ar</div>
</div>

<canvas id="c"></canvas>
<div id="quote">
  <span class="frase">&#8220;A mem&#243;ria &#233; o tesouro e guardi&#227;o<br>de todas as coisas.&#8221;</span>
  <span class="autor">C&#237;cero</span>
</div>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = ['#E6E0CF','#DFDAE6','#D5E6E2','#E6E2D5','#DBD8E6','#D0DDE6','#EBEFFF','#FFDEF0','#E1FFEF'];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const TRACKS = ['../audio/1.AAC','../audio/2.AAC','../audio/3.AAC','../audio/4.AAC','../audio/5.AAC'];
  let lastTrack = -1; let muted = false;
  const audio = new Audio(); audio.volume = 0.25;
  function pickTrack() { let idx; do { idx = Math.floor(Math.random() * TRACKS.length); } while (idx === lastTrack && TRACKS.length > 1); lastTrack = idx; return TRACKS[idx]; }
  function playNext() { audio.src = pickTrack(); audio.volume = muted ? 0 : 0.25; audio.play().catch(() => {}); }
  audio.addEventListener('ended', playNext);
  const muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; audio.volume = muted ? 0 : 0.25; muteBtn.textContent = muted ? '\u266f' : '\u266a'; muteBtn.style.opacity = muted ? '0.18' : ''; });
  function fadeOutAudio() { const steps=40,duration=2000,interval=duration/steps; const volStep=audio.volume/steps; let s=0; const t=setInterval(()=>{s++;audio.volume=Math.max(0,audio.volume-volStep);if(s>=steps)clearInterval(t);},interval); }

  const intro = document.getElementById('intro');
  const hint  = document.getElementById('intro-hint');
  let gameStarted = false;

  function showIntro() {
    intro.style.opacity = '1';
    setTimeout(()=>{ const l=document.getElementById('line1'); l.style.opacity='1'; l.style.transform='translateY(0)'; }, 400);
    setTimeout(()=>{ const l=document.getElementById('line2'); l.style.opacity='1'; l.style.transform='translateY(0)'; }, 1300);
    setTimeout(()=>{ hint.style.opacity='1'; }, 2800);
  }

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    playNext();
    intro.style.transition = 'opacity 2s ease';
    intro.style.opacity = '0';
    intro.style.pointerEvents = 'none';
    setTimeout(() => { intro.style.display = 'none'; enableGame(); }, 2000);
  }

  intro.addEventListener('click', startGame);
  intro.addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, { passive: false });

  const flash  = document.getElementById('flash');
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const voltar = document.getElementById('voltar');
  const quote  = document.getElementById('quote');

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const rOuter = () => Math.min(canvas.width, canvas.height) * 0.38;
  const rInner = () => Math.min(canvas.width, canvas.height) * 0.10;
  const margin = () => Math.min(canvas.width, canvas.height) * 0.07;
  const rMin   = () => rInner() + margin();
  const rMax   = () => rOuter() - margin();
  const neutralBand = 0.15;

  let t = 0.5;
  const speedExpand = 0.18, speedRetract = 0.18;
  let pressing = false, lastTick = null, count = 30, started = false, leaving = false, quoteVisible = false;

  function updateQuote() {
    const shouldShow = (count <= 20 && count > 10);
    if (shouldShow && !quoteVisible) { quote.style.opacity = '1'; quoteVisible = true; }
    else if (!shouldShow && quoteVisible) { quote.style.opacity = '0'; quoteVisible = false; }
  }

  function triggerExit(href) {
    if (leaving) return; leaving = true;
    if (!muted) fadeOutAudio();
    flash.style.opacity = '1';
    setTimeout(() => window.location.href = href, 4000);
  }

  function calcProx(t) { const d = Math.abs(t - 0.5); if (d <= neutralBand) return 0; return Math.min((d - neutralBand) / (0.5 - neutralBand), 1); }

  function drawVinheta(alpha) {
    const w = canvas.width, h = canvas.height, depth = 0.45;
    const color = `rgba(15,13,10,${alpha})`, transparent = 'rgba(15,13,10,0)';
    let g;
    g = ctx.createLinearGradient(0,0,0,h*depth); g.addColorStop(0,color); g.addColorStop(1,transparent); ctx.fillStyle=g; ctx.fillRect(0,0,w,h*depth);
    g = ctx.createLinearGradient(0,h,0,h-h*depth); g.addColorStop(0,color); g.addColorStop(1,transparent); ctx.fillStyle=g; ctx.fillRect(0,h-h*depth,w,h*depth);
    g = ctx.createLinearGradient(0,0,w*depth,0); g.addColorStop(0,color); g.addColorStop(1,transparent); ctx.fillStyle=g; ctx.fillRect(0,0,w*depth,h);
    g = ctx.createLinearGradient(w,0,w-w*depth,0); g.addColorStop(0,color); g.addColorStop(1,transparent); ctx.fillStyle=g; ctx.fillRect(w-w*depth,0,w*depth,h);
  }

  function isOnVoltar(x, y) { const r = voltar.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }

  function draw(ts) {
    if (!lastTick) lastTick = ts;
    const delta = (ts - lastTick) / 1000; lastTick = ts;
    if (pressing) { t = Math.max(0, t - speedRetract * delta); }
    else { t = Math.min(1, t + speedExpand * delta); }
    if (started && count > 0) { count = Math.max(0, count - delta); if (count <= 0) triggerExit('../'); }
    updateQuote();
    const cx=canvas.width/2,cy=canvas.height/2,ro=rOuter(),ri=rInner(),rn=rMin(),rx=rMax(),rm=rn+t*(rx-rn);
    const prox=calcProx(t),proxInner=t<0.5?prox:0,proxOuter=t>0.5?prox:0;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.beginPath(); ctx.arc(cx,cy,ro,0,Math.PI*2); ctx.strokeStyle='rgba(30,28,25,0.7)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,ri,0,Math.PI*2); ctx.strokeStyle='rgba(30,28,25,0.7)'; ctx.lineWidth=1; ctx.stroke();
    if (proxInner>0) { const gr=ro*0.80,grad=ctx.createRadialGradient(cx,cy,0,cx,cy,gr); grad.addColorStop(0,`rgba(15,13,10,${0.95*proxInner})`); grad.addColorStop(0.25,`rgba(15,13,10,${0.75*proxInner})`); grad.addColorStop(0.6,`rgba(15,13,10,${0.3*proxInner})`); grad.addColorStop(1,'rgba(15,13,10,0)'); ctx.beginPath(); ctx.arc(cx,cy,gr,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill(); }
    if (proxOuter>0) drawVinheta(0.97*proxOuter);
    ctx.beginPath(); ctx.arc(cx,cy,rm,0,Math.PI*2); ctx.strokeStyle='rgba(30,28,25,0.75)'; ctx.lineWidth=1.2; ctx.stroke();
    if (started) { ctx.fillStyle='rgba(30,28,25,0.75)'; ctx.font='2.2rem "VeteranTypewriter", serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(Math.ceil(count),cx,cy); }
    requestAnimationFrame(draw);
  }

  function enableGame() {
    canvas.style.pointerEvents = 'auto';
    document.addEventListener('mousedown', (e) => { if (!isOnVoltar(e.clientX,e.clientY)) { pressing=true; startIfNeeded(); } });
    document.addEventListener('mouseup', ()=>pressing=false);
    document.addEventListener('mouseleave', ()=>pressing=false);
    document.addEventListener('touchstart', (e) => { const touch=e.touches[0]; if (isOnVoltar(touch.clientX,touch.clientY)) { triggerExit('../'); } else { e.preventDefault(); pressing=true; startIfNeeded(); } }, {passive:false});
    document.addEventListener('touchend', (e)=>{e.preventDefault();pressing=false;},{passive:false});
    document.addEventListener('touchcancel', ()=>pressing=false);
  }

  function startIfNeeded() { if (!started) started = true; }
  voltar.addEventListener('click', function(e) { e.preventDefault(); triggerExit(this.href); });

  document.fonts.ready.then(() => {
    requestAnimationFrame(draw);
    requestAnimationFrame(() => flash.style.opacity = '0');
    setTimeout(showIntro, 800);
  });
</script>
</body>
</html>
