<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esperar</title>
  <style>
    @font-face { font-family: 'VeteranTypewriter'; src: url('../fonts/veteran typewriter.ttf') format('truetype'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
      user-select: none; -webkit-user-select: none;
      background-color: #ffffff;
    }
    canvas { display: block; touch-action: none; pointer-events: none; }
    #flash { position: fixed; inset: 0; background: #ffffff; opacity: 1; transition: opacity 4s ease; pointer-events: none; z-index: 100; }

    #intro {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 80; cursor: pointer;
      opacity: 0; transition: opacity 2.5s ease;
    }
    #intro-text {
      font-family: 'VeteranTypewriter', serif;
      font-size: 1.05rem; font-weight: 300;
      letter-spacing: 0.13em; line-height: 2.2;
      color: rgba(30,28,25,0.70); text-align: center;
    }
    #intro-text span {
      display: block; opacity: 0; transform: translateY(6px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }
    #intro-hint {
      margin-top: 2.8rem;
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.65rem; letter-spacing: 0.22em;
      color: rgba(30,28,25,0.28);
      opacity: 0; transition: opacity 2s ease;
    }

    #countdown { position: fixed; bottom: 10rem; left: 50%; transform: translateX(-50%); font-family: 'VeteranTypewriter', serif; font-size: 1.1rem; letter-spacing: 0.12em; color: rgba(30,28,25,0.55); pointer-events: none; opacity: 0; transition: opacity 1.2s ease; z-index: 50; }
    #voltar { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); font-family: 'VeteranTypewriter', serif; font-size: 0.85rem; color: rgba(30,28,25,0.5); text-decoration: none; letter-spacing: 0.1em; z-index: 200; padding: 1rem 1.5rem; }
    #voltar:hover { opacity: 0.3; }
    #mute-btn { position: fixed; top: 1.4rem; right: 1.6rem; background: none; border: none; cursor: pointer; font-family: 'VeteranTypewriter', serif; font-size: 0.72rem; letter-spacing: 0.12em; color: rgba(30,28,25,0.35); z-index: 200; padding: 0.5rem; transition: opacity 0.3s; }
    #mute-btn:hover { opacity: 0.15; }
  </style>
</head>
<body>
<div id="flash"></div>
<button id="mute-btn" title="silenciar">&#9834;</button>

<div id="intro">
  <div id="intro-text">
    <span id="line1">Clique na tela.</span>
    <span id="line2">Esperar tamb&#233;m &#233;</span>
    <span id="line3">uma forma de presen&#231;a.</span>
  </div>
  <div id="intro-hint">toque para come&#231;ar</div>
</div>

<canvas id="c"></canvas>
<div id="countdown"></div>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores=['#E6E0CF','#DFDAE6','#D5E6E2','#E6E2D5','#DBD8E6','#D0DDE6','#EBEFFF','#FFDEF0','#E1FFEF'];
  document.body.style.backgroundColor=cores[Math.floor(Math.random()*cores.length)];

  const TRACKS=['../audio/1.AAC','../audio/2.AAC','../audio/3.AAC','../audio/4.AAC','../audio/5.AAC'];
  let lastTrack=-1,muted=false;
  const audio=new Audio();audio.volume=0.25;
  function pickTrack(){let idx;do{idx=Math.floor(Math.random()*TRACKS.length);}while(idx===lastTrack&&TRACKS.length>1);lastTrack=idx;return TRACKS[idx];}
  function playNext(){audio.src=pickTrack();audio.volume=muted?0:0.25;audio.play().catch(()=>{});}
  audio.addEventListener('ended',playNext);
  const muteBtn=document.getElementById('mute-btn');
  muteBtn.addEventListener('click',(e)=>{e.stopPropagation();muted=!muted;audio.volume=muted?0:0.25;muteBtn.textContent=muted?'\u266f':'\u266a';muteBtn.style.opacity=muted?'0.18':'';});
  function fadeOutAudio(){const steps=40,duration=2000,interval=duration/steps;const volStep=audio.volume/steps;let s=0;const t=setInterval(()=>{s++;audio.volume=Math.max(0,audio.volume-volStep);if(s>=steps)clearInterval(t);},interval);}

  const intro=document.getElementById('intro');
  const hint=document.getElementById('intro-hint');
  let gameStarted=false;

  function showIntro(){
    intro.style.opacity='1';
    setTimeout(()=>{const l=document.getElementById('line1');l.style.opacity='1';l.style.transform='translateY(0)';},400);
    setTimeout(()=>{const l=document.getElementById('line2');l.style.opacity='1';l.style.transform='translateY(0)';},1200);
    setTimeout(()=>{const l=document.getElementById('line3');l.style.opacity='1';l.style.transform='translateY(0)';},1900);
    setTimeout(()=>{hint.style.opacity='1';},3400);
  }

  function startGame(){
    if(gameStarted)return;
    gameStarted=true;
    playNext();
    intro.style.transition='opacity 2s ease';
    intro.style.opacity='0';
    intro.style.pointerEvents='none';
    setTimeout(()=>{intro.style.display='none';startLoop();},2000);
  }

  intro.addEventListener('click',startGame);
  intro.addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});

  const flash=document.getElementById('flash'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),voltar=document.getElementById('voltar'),countEl=document.getElementById('countdown');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);

  const DURATION=30,DOT_R=4,GAP=18,MAX_RINGS=8,STEP=DURATION/MAX_RINGS;
  const FADE_IN_SPD=0.00055,FADE_OUT_SPD=0.00040;
  let count=DURATION,pressing=false,lastTick=null,leaving=false;
  const slots=Array.from({length:MAX_RINGS+1},()=>({alpha:0,target:0}));

  function activeLevel(){if(count>=DURATION)return -1;return Math.min(MAX_RINGS,Math.floor((DURATION-count)/STEP));}
  function updateSlots(){const lvl=activeLevel();for(let i=0;i<=MAX_RINGS;i++)slots[i].target=(i===lvl)?1:0;}
  function tickSlots(delta){for(let i=0;i<=MAX_RINGS;i++){const s=slots[i];if(s.target>s.alpha)s.alpha=Math.min(1,s.alpha+FADE_IN_SPD*delta);else if(s.target<s.alpha)s.alpha=Math.max(0,s.alpha-FADE_OUT_SPD*delta);}}
  function ringRadius(i){return DOT_R+i*GAP;}
  function circleY(){return canvas.height*0.28;}

  function draw(ts){
    if(!lastTick)lastTick=ts;
    const delta=ts-lastTick;lastTick=ts;
    if(pressing)count=Math.max(0,count-delta/1000);
    else count=Math.min(DURATION,count+delta/1000);
    if(count<=0&&!leaving)triggerExit('../');
    updateSlots();tickSlots(delta);
    const cx=canvas.width/2,cy=circleY();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=MAX_RINGS;i>=0;i--){const s=slots[i];if(s.alpha<=0.002)continue;const r=ringRadius(i);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      if(i===0){ctx.fillStyle=`rgba(30,28,25,${0.75*s.alpha})`;ctx.fill();}
      else{ctx.strokeStyle=`rgba(30,28,25,${0.72*s.alpha})`;ctx.lineWidth=1;ctx.stroke();}}
    const display=Math.ceil(count);
    if(count<DURATION){countEl.textContent=display===0?'0':String(display);countEl.style.opacity='1';}
    else countEl.style.opacity='0';
    requestAnimationFrame(draw);
  }

  function triggerExit(href){if(leaving)return;leaving=true;if(!muted)fadeOutAudio();flash.style.transition='opacity 4s ease';flash.style.opacity='1';setTimeout(()=>window.location.href=href,4000);}
  function isOnVoltar(x,y){const r=voltar.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}

  voltar.addEventListener('click',function(e){e.preventDefault();triggerExit(this.href);});
  document.addEventListener('mousedown',(e)=>{if(!isOnVoltar(e.clientX,e.clientY))pressing=true;});
  document.addEventListener('mouseup',()=>pressing=false);
  document.addEventListener('mouseleave',()=>pressing=false);
  document.addEventListener('touchstart',(e)=>{const t=e.touches[0];if(isOnVoltar(t.clientX,t.clientY))triggerExit('../');else{e.preventDefault();pressing=true;}},{passive:false});
  document.addEventListener('touchend',(e)=>{e.preventDefault();pressing=false;},{passive:false});
  document.addEventListener('touchcancel',()=>pressing=false);

  function startLoop(){lastTick=null;requestAnimationFrame(draw);}

  document.fonts.ready.then(()=>{
    requestAnimationFrame(()=>flash.style.opacity='0');
    setTimeout(showIntro,800);
  });
</script>
</body>
</html>
