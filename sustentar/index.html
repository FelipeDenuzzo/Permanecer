<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sustentar</title>
  <style>
    @font-face { font-family: 'VeteranTypewriter'; src: url('../fonts/veteran typewriter.ttf') format('truetype'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; background-color: #ffffff; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
    #flash { position: fixed; inset: 0; background: #ffffff; opacity: 1; transition: opacity 4s ease; pointer-events: none; z-index: 100; }
    #quote { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); text-align: center; font-family: 'VeteranTypewriter', serif; color: rgba(30,28,25,0.75); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; white-space: normal; width: 80vw; max-width: 360px; z-index: 50; }
    #quote .frase { font-size: 0.9rem; letter-spacing: 0.06em; line-height: 1.5; display: block; margin-bottom: 0.4rem; }
    #quote .autor { font-size: 0.72rem; letter-spacing: 0.1em; opacity: 0.6; display: block; }
    #voltar { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); font-family: 'VeteranTypewriter', serif; font-size: 0.85rem; color: rgba(30,28,25,0.5); text-decoration: none; letter-spacing: 0.1em; z-index: 200; padding: 1rem 1.5rem; }
    #voltar:hover { opacity: 0.3; }
    #mute-btn { position: fixed; top: 1.4rem; right: 1.6rem; background: none; border: none; cursor: pointer; font-family: 'VeteranTypewriter', serif; font-size: 0.72rem; letter-spacing: 0.12em; color: rgba(30,28,25,0.35); z-index: 200; padding: 0.5rem; transition: opacity 0.3s; }
    #mute-btn:hover { opacity: 0.15; }
  </style>
</head>
<body>
<div id="flash"></div>
<button id="mute-btn" title="silenciar">&#9834;</button>
<canvas id="c"></canvas>
<div id="quote">
  <span class="frase">&#8220;O sofrimento precisa ser superado,<br>e o único meio de superá-lo<br>é suportando-o.&#8221;</span>
  <span class="autor">Carl Jung</span>
</div>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = ['#E6E0CF','#DFDAE6','#D5E6E2','#E6E2D5','#DBD8E6','#D0DDE6','#EBEFFF','#FFDEF0','#E1FFEF'];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const TRACKS = ['../audio/1.AAC','../audio/2.AAC','../audio/3.AAC','../audio/4.AAC','../audio/5.AAC'];
  let lastTrack=-1,muted=false;
  const audio=new Audio(); audio.volume=0.5;
  function pickTrack(){let idx;do{idx=Math.floor(Math.random()*TRACKS.length);}while(idx===lastTrack&&TRACKS.length>1);lastTrack=idx;return TRACKS[idx];}
  function playNext(){audio.src=pickTrack();audio.volume=muted?0:0.5;audio.play().catch(()=>{});}
  audio.addEventListener('ended',playNext);
  const muteBtn=document.getElementById('mute-btn');
  muteBtn.addEventListener('click',(e)=>{e.stopPropagation();muted=!muted;audio.volume=muted?0:0.5;muteBtn.textContent=muted?'\u266f':'\u266a';muteBtn.style.opacity=muted?'0.18':''});
  function fadeOutAudio(){const steps=40,duration=2000,interval=duration/steps;const volStep=audio.volume/steps;let s=0;const t=setInterval(()=>{s++;audio.volume=Math.max(0,audio.volume-volStep);if(s>=steps)clearInterval(t);},interval);}

  const flash=document.getElementById('flash'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),voltar=document.getElementById('voltar'),quote=document.getElementById('quote');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize(); window.addEventListener('resize',()=>{resize();initPositions();});
  function rSmall(){return Math.min(canvas.width,canvas.height)*0.055;}
  function rLarge(){return Math.min(canvas.width,canvas.height)*0.10;}
  let smallX,smallY,largeX,largeY,largeVX,largeVY;
  function initPositions(){smallX=canvas.width/2;smallY=canvas.height*0.25;largeX=canvas.width/2;largeY=canvas.height*0.75;largeVX=0;largeVY=0;}
  initPositions();
  let pressed=false,countdownStarted=false,count=30,leaving=false,quoteVisible=false;
  let strokeExtra=0;
  const strokeExtraMax=6,strokeGrowSpeed=80,strokeShrinkSpeed=60;
  const GRAVITY=280,DAMPING=0.018,MAG_STRENGTH=1800,MAG_CURVE=0.6,REST_SPRING=1.2;
  function updateQuote(){const s=(countdownStarted&&count<=20&&count>10);if(s&&!quoteVisible){quote.style.opacity='1';quoteVisible=true;}else if(!s&&quoteVisible){quote.style.opacity='0';quoteVisible=false;}}
  function triggerExit(href){if(leaving)return;leaving=true;if(!muted)fadeOutAudio();flash.style.opacity='1';setTimeout(()=>window.location.href=href,4000);}
  function isOnVoltar(x,y){const r=voltar.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
  function hitSmall(x,y){const dx=x-smallX,dy=y-smallY;return Math.sqrt(dx*dx+dy*dy)<=rSmall()+12;}
  let lastTick=null;
  function update(delta){
    const dt=delta/1000;
    if(pressed){strokeExtra=Math.min(strokeExtraMax,strokeExtra+strokeGrowSpeed*dt);}else{strokeExtra=Math.max(0,strokeExtra-strokeShrinkSpeed*dt);}
    const baseX=canvas.width/2,baseY=canvas.height*0.75;
    if(pressed){const dx=smallX-largeX,dy=smallY-largeY,dist=Math.sqrt(dx*dx+dy*dy)||1,nx=dx/dist,ny=dy/dist,forceMag=MAG_STRENGTH*Math.pow(dist/(rLarge()*4),MAG_CURVE);largeVX+=nx*forceMag*dt;largeVY+=ny*forceMag*dt;}else{largeVY+=GRAVITY*dt;largeVX+=(baseX-largeX)*REST_SPRING*dt;largeVY+=(baseY-largeY)*REST_SPRING*dt;}
    const damp=1-DAMPING*(delta/16);largeVX*=damp;largeVY*=damp;largeX+=largeVX*dt;largeY+=largeVY*dt;
    const rl=rLarge();
    if(largeX-rl<0){largeX=rl;largeVX*=-0.4;}if(largeX+rl>canvas.width){largeX=canvas.width-rl;largeVX*=-0.4;}
    if(largeY-rl<0){largeY=rl;largeVY*=-0.4;}if(largeY+rl>canvas.height){largeY=canvas.height-rl;largeVY*=-0.4;}
    if(countdownStarted&&pressed&&count>0){count=Math.max(0,count-dt);if(count<=0)triggerExit('../');}
    updateQuote();
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const rs=rSmall(),rl=rLarge();
    ctx.strokeStyle='rgba(30,28,25,0.65)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(largeX,largeY,rl,0,Math.PI*2);ctx.stroke();
    const strokeR=rs+strokeExtra;ctx.strokeStyle='rgba(30,28,25,0.75)';ctx.lineWidth=pressed?1.8:1.2;ctx.beginPath();ctx.arc(smallX,smallY,strokeR,0,Math.PI*2);ctx.stroke();
    if(countdownStarted){ctx.save();ctx.fillStyle='rgba(30,28,25,0.75)';ctx.font='1.3rem "VeteranTypewriter", serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(Math.ceil(count),smallX,smallY-strokeR-10);ctx.restore();}
  }
  function loop(ts){if(!lastTick)lastTick=ts;const delta=ts-lastTick;lastTick=ts;update(delta);draw();requestAnimationFrame(loop);}
  document.fonts.ready.then(()=>{playNext();requestAnimationFrame(loop);requestAnimationFrame(()=>flash.style.opacity='0');});
  function onStart(x,y){if(leaving)return;if(isOnVoltar(x,y)){triggerExit('../');return;}if(hitSmall(x,y)){pressed=true;if(!countdownStarted)countdownStarted=true;}}
  function onEnd(){pressed=false;}
  canvas.addEventListener('mousedown',e=>onStart(e.clientX,e.clientY));
  document.addEventListener('mouseup',onEnd);document.addEventListener('mouseleave',onEnd);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];onStart(t.clientX,t.clientY);},{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();onEnd();},{passive:false});
  canvas.addEventListener('touchcancel',onEnd);
  voltar.addEventListener('click',e=>{e.preventDefault();triggerExit('../');});
</script>
</body>
</html>
