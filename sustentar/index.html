<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sustentar</title>
  <style>
    @font-face {
      font-family: 'VeteranTypewriter';
      src: url('../fonts/veteran typewriter.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #ffffff;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 1;
      transition: opacity 4s ease;
      pointer-events: none;
      z-index: 100;
    }
    #voltar {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VeteranTypewriter', serif;
      font-size: 0.85rem;
      color: rgba(30,28,25,0.5);
      text-decoration: none;
      letter-spacing: 0.1em;
      z-index: 200;
      padding: 1rem 1.5rem;
    }
    #voltar:hover { opacity: 0.3; }
  </style>
</head>
<body>
<div id="flash"></div>
<canvas id="c"></canvas>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const flash = document.getElementById('flash');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const voltar = document.getElementById('voltar');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); initPositions(); });

  // ── raios ──────────────────────────────────────────────────────────────
  function rSmall() { return Math.min(canvas.width, canvas.height) * 0.055; }
  function rLarge() { return Math.min(canvas.width, canvas.height) * 0.10; }

  // ── posições base ──────────────────────────────────────────────────────
  // pequeno: fixo, topo (25% da altura)
  // grande:  bottom (75% da altura), com física
  let smallX, smallY;
  let largeX, largeY, largeVX, largeVY;

  function initPositions() {
    smallX = canvas.width / 2;
    smallY = canvas.height * 0.25;
    largeX = canvas.width / 2;
    largeY = canvas.height * 0.75;
    largeVX = 0;
    largeVY = 0;
  }
  initPositions();

  // ── estado ─────────────────────────────────────────────────────────────
  let pressed = false;
  let countdownStarted = false;
  let count = 30;           // segundos
  let leaving = false;

  // animação do contorno do círculo pequeno
  let strokeExtra = 0;      // extra de raio do contorno (0 → max)
  const strokeExtraMax = 6;
  const strokeGrowSpeed  = 80;  // px/s
  const strokeShrinkSpeed = 60;

  // ── física ─────────────────────────────────────────────────────────────
  const GRAVITY      = 280;   // px/s²  — puxa o grande para baixo
  const DAMPING      = 0.018; // amortecimento por frame (multiplicativo)
  const MAG_STRENGTH = 1800;  // força do ímã (px/s² normalizada * dist)
  const MAG_CURVE    = 0.6;   // expoente da curva de atração (< 1 = curva suave)
  const REST_SPRING  = 1.2;   // mola de retorno à posição base (quando solto)

  // ── saída ──────────────────────────────────────────────────────────────
  function triggerExit(href) {
    if (leaving) return;
    leaving = true;
    flash.style.opacity = '1';
    setTimeout(() => window.location.href = href, 4000);
  }

  function isOnVoltar(x, y) {
    const r = voltar.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  // ── hit test no círculo pequeno ────────────────────────────────────────
  function hitSmall(x, y) {
    const dx = x - smallX, dy = y - smallY;
    return Math.sqrt(dx*dx + dy*dy) <= rSmall() + 12;
  }

  // ── loop ───────────────────────────────────────────────────────────────
  let lastTick = null;

  function update(delta) {
    const dt = delta / 1000; // segundos

    // animação do contorno
    if (pressed) {
      strokeExtra = Math.min(strokeExtraMax, strokeExtra + strokeGrowSpeed * dt);
    } else {
      strokeExtra = Math.max(0, strokeExtra - strokeShrinkSpeed * dt);
    }

    // física do círculo grande
    const baseX = canvas.width / 2;
    const baseY = canvas.height * 0.75;

    if (pressed) {
      // força magnética em direção ao círculo pequeno
      const dx = smallX - largeX;
      const dy = smallY - largeY;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = dx / dist;
      const ny = dy / dist;
      // força cresce com curva suave conforme a distância
      const forceMag = MAG_STRENGTH * Math.pow(dist / (rLarge() * 4), MAG_CURVE);
      largeVX += nx * forceMag * dt;
      largeVY += ny * forceMag * dt;
    } else {
      // gravidade
      largeVY += GRAVITY * dt;
      // mola de retorno suave à posição base
      largeVX += (baseX - largeX) * REST_SPRING * dt;
      largeVY += (baseY - largeY) * REST_SPRING * dt;
    }

    // amortecimento
    const damp = 1 - DAMPING * (delta / 16);
    largeVX *= damp;
    largeVY *= damp;

    largeX += largeVX * dt;
    largeY += largeVY * dt;

    // colisão com bordas
    const rl = rLarge();
    if (largeX - rl < 0)               { largeX = rl;                   largeVX *= -0.4; }
    if (largeX + rl > canvas.width)    { largeX = canvas.width - rl;    largeVX *= -0.4; }
    if (largeY - rl < 0)               { largeY = rl;                   largeVY *= -0.4; }
    if (largeY + rl > canvas.height)   { largeY = canvas.height - rl;   largeVY *= -0.4; }

    // contagem regressiva
    if (countdownStarted && pressed && count > 0) {
      count = Math.max(0, count - dt);
      if (count <= 0) triggerExit('../');
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const rs = rSmall();
    const rl = rLarge();

    // ── círculo grande (inferior, com física) ──────────────────────────
    ctx.strokeStyle = 'rgba(30,28,25,0.65)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(largeX, largeY, rl, 0, Math.PI * 2);
    ctx.stroke();

    // ── círculo pequeno (fixo, topo) ──────────────────────────────────
    // contorno progressivo quando pressionado
    const strokeR = rs + strokeExtra;
    ctx.strokeStyle = 'rgba(30,28,25,0.75)';
    ctx.lineWidth = pressed ? 1.8 : 1.2;
    ctx.beginPath();
    ctx.arc(smallX, smallY, strokeR, 0, Math.PI * 2);
    ctx.stroke();

    // ── contagem regressiva (acima do círculo pequeno) ─────────────────
    if (countdownStarted) {
      ctx.save();
      ctx.fillStyle = 'rgba(30,28,25,0.75)';
      ctx.font = `1.3rem "VeteranTypewriter", serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(Math.ceil(count), smallX, smallY - strokeR - 10);
      ctx.restore();
    }
  }

  function loop(ts) {
    if (!lastTick) lastTick = ts;
    const delta = ts - lastTick;
    lastTick = ts;
    update(delta);
    draw();
    requestAnimationFrame(loop);
  }

  document.fonts.ready.then(() => {
    requestAnimationFrame(loop);
    requestAnimationFrame(() => flash.style.opacity = '0');
  });

  // ── eventos ────────────────────────────────────────────────────────────
  function onStart(x, y) {
    if (leaving) return;
    if (isOnVoltar(x, y)) { triggerExit('../'); return; }
    if (hitSmall(x, y)) {
      pressed = true;
      if (!countdownStarted) countdownStarted = true;
    }
  }

  function onEnd() {
    pressed = false;
  }

  // mouse
  canvas.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('mouseleave', onEnd);

  // touch
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, { passive: false });
  canvas.addEventListener('touchcancel', onEnd);

  voltar.addEventListener('click', e => { e.preventDefault(); triggerExit('../'); });
</script>
</body>
</html>
