<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; touch-action: none; }
    #voltar {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: Georgia, serif;
      font-size: 0.85rem;
      font-weight: 300;
      color: rgba(30,28,25,0.5);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 4s ease;
      z-index: 10;
    }
    #voltar:hover { opacity: 0.3 !important; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<a id="voltar" href="../">Permanecer</a>
<script>
  const cores = [
    '#E6E0CF','#DFDAE6','#D5E6E2',
    '#E6E2D5','#DBD8E6','#D0DDE6',
    '#EBEFFF','#FFDEF0','#E1FFEF'
  ];
  document.body.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const voltar = document.getElementById('voltar');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const breathPeriod = 8000;
  const baseRadius = () => Math.min(canvas.width, canvas.height) * 0.18;
  const breathAmplitude = () => baseRadius() * 0.10;

  let count = 30;
  let pressing = false;
  let lastTick = null;
  let elapsed = 0;

  // Fade: 0 = invisivel, 1 = visivel
  const fadeDuration = 4000;
  let fadeAlpha = 0;
  let fadeDir = 1; // 1 = entrando, -1 = saindo
  let fadeStart = null;
  let navigateTo = null;

  function getFade(ts) {
    if (fadeStart === null) fadeStart = ts;
    const t = Math.min((ts - fadeStart) / fadeDuration, 1);
    return fadeDir === 1 ? t : 1 - t;
  }

  function getRadius(t) {
    const phase = (t % breathPeriod) / breathPeriod;
    const s = (Math.sin(phase * Math.PI * 2 - Math.PI / 2) + 1) / 2;
    return baseRadius() - breathAmplitude() / 2 + s * breathAmplitude();
  }

  function draw(ts) {
    if (!lastTick) lastTick = ts;
    const delta = ts - lastTick;
    lastTick = ts;
    elapsed += delta;

    fadeAlpha = getFade(ts);
    voltar.style.opacity = fadeAlpha * 0.5;

    if (navigateTo && fadeAlpha <= 0) {
      window.location.href = navigateTo;
      return;
    }

    if (pressing) {
      count = Math.max(0, count - delta / 1000);
    } else {
      count = Math.min(30, count + delta / 1000);
    }

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = getRadius(elapsed);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.globalAlpha = fadeAlpha;

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(30,28,25,0.75)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(30,28,25,0.75)';
    ctx.font = '300 2.2rem Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(count), cx, cy);

    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);

  voltar.addEventListener('click', function(e) {
    e.preventDefault();
    navigateTo = this.href;
    fadeDir = -1;
    fadeStart = null;
  });

  document.addEventListener('mousedown', (e) => { if (e.target !== voltar) pressing = true; });
  document.addEventListener('mouseup', () => pressing = false);
  document.addEventListener('mouseleave', () => pressing = false);
  document.addEventListener('touchstart', (e) => {
    if (e.target !== voltar) { e.preventDefault(); pressing = true; }
  }, { passive: false });
  document.addEventListener('touchend', (e) => { e.preventDefault(); pressing = false; }, { passive: false });
  document.addEventListener('touchcancel', () => pressing = false);
</script>
</body>
</html>
