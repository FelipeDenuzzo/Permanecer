<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reter</title>
  <style>
    @font-face { font-family: 'VeteranTypewriter'; src: url('../fonts/veteran typewriter.ttf') format('truetype'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; background-color: #ffffff; }
    canvas { display: block; touch-action: none; pointer-events: none; }
    #flash { position: fixed; inset: 0; background: #ffffff; opacity: 1; transition: opacity 4s ease; pointer-events: none; z-index: 100; }
    #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 18vh; z-index: 80; cursor: pointer; opacity: 0; transition: opacity 2.5s ease; }
    #intro-text { font-family: 'VeteranTypewriter', serif; font-size: 1.05rem; font-weight: 300; letter-spacing: 0.13em; line-height: 2.2; color: rgba(30,28,25,0.70); text-align: center; }
    #intro-text span { display: block; opacity: 0; transform: translateY(6px); transition: opacity 1.8s ease, transform 1.8s ease; }
    #intro-hint { margin-top: 2.8rem; font-family: 'VeteranTypewriter', serif; font-size: 0.65rem; letter-spacing: 0.22em; color: rgba(30,28,25,0.28); opacity: 0; transition: opacity 2s ease; }
    #quote { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); text-align: center; font-family: 'VeteranTypewriter', serif; color: rgba(30,28,25,0.75); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; white-space: normal; width: 80vw; max-width: 360px; z-index: 50; }
    #quote .frase { font-size: 0.9rem; letter-spacing: 0.06em; line-height: 1.5; display: block; margin-bottom: 0.4rem; }
    #quote .autor { font-size: 0.72rem; letter-spacing: 0.1em; opacity: 0.6; display: block; }
    #voltar { position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%); font-family: 'VeteranTypewriter', serif; font-size: 0.85rem; color: rgba(30,28,25,0.5); text-decoration: none; letter-spacing: 0.1em; z-index: 200; padding: 1rem 1.5rem; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
    #voltar:hover { opacity: 0.3; }
    #mute-btn { position: fixed; top: 1.4rem; right: 1.6rem; background: none; border: none; cursor: pointer; font-family: 'VeteranTypewriter', serif; font-size: 0.72rem; letter-spacing: 0.12em; color: rgba(30,28,25,0.35); z-index: 200; padding: 0.5rem; transition: opacity 0.3s; }
    #mute-btn:hover { opacity: 0.15; }
  </style>
</head>
<body>
<div id="flash"></div>
<button id="mute-btn" title="silenciar">&#9834;</button>
<div id="intro">
  <div id="intro-text">
    <span id="line1">Mantenha o dedo pressionado</span>
    <span id="line2">e respire.</span>
  </div>
  <div id="intro-hint">toque para come&#231;ar</div>
</div>
<canvas id="c"></canvas>
<div id="quote"><span class="frase"></span><span class="autor"></span></div>
<a id="voltar" href="../">Voltar</a>
<script>
  const cores=['#E6E0CF','#DFDAE6','#D5E6E2','#E6E2D5','#DBD8E6','#D0DDE6','#EBEFFF','#FFDEF0','#E1FFEF'];
  document.body.style.backgroundColor=cores[Math.floor(Math.random()*cores.length)];
  const frases=[{texto:'\u201cAquilo a que voc\u00ea resiste, persiste.\u201d',autor:'Carl Jung'},{texto:'\u201cA l\u00edngua revela o conte\u00fado do cora\u00e7\u00e3o.\u201d',autor:'Emmanuel'}];
  const escolha=frases[Math.floor(Math.random()*frases.length)];
  document.querySelector('#quote .frase').textContent=escolha.texto;
  document.querySelector('#quote .autor').textContent=escolha.autor;
  const TRACKS=['../audio/1.AAC','../audio/2.AAC','../audio/3.AAC','../audio/4.AAC','../audio/5.AAC'];
  let lastTrack=-1,muted=false;
  const audio=new Audio();audio.volume=0.25;
  function pickTrack(){let idx;do{idx=Math.floor(Math.random()*TRACKS.length);}while(idx===lastTrack&&TRACKS.length>1);lastTrack=idx;return TRACKS[idx];}
  function playNext(){audio.src=pickTrack();audio.volume=muted?0:0.25;audio.play().catch(()=>{});}
  audio.addEventListener('ended',playNext);
  const muteBtn=document.getElementById('mute-btn');
  muteBtn.addEventListener('click',(e)=>{e.stopPropagation();muted=!muted;audio.volume=muted?0:0.25;muteBtn.textContent=muted?'\u266f':'\u266a';muteBtn.style.opacity=muted?'0.18':'';});
  function fadeOutAudio(){const steps=40,duration=2000,interval=duration/steps;const volStep=audio.volume/steps;let s=0;const t=setInterval(()=>{s++;audio.volume=Math.max(0,audio.volume-volStep);if(s>=steps)clearInterval(t);},interval);}
  const intro=document.getElementById('intro'),hint=document.getElementById('intro-hint');
  let gameStarted=false;
  function showIntro(){
    intro.style.opacity='1';
    setTimeout(()=>{const l=document.getElementById('line1');l.style.opacity='1';l.style.transform='translateY(0)';},400);
    setTimeout(()=>{const l=document.getElementById('line2');l.style.opacity='1';l.style.transform='translateY(0)';},1300);
    setTimeout(()=>{hint.style.opacity='1';},2800);
  }
  function startGame(){
    if(gameStarted)return;gameStarted=true;playNext();
    intro.style.transition='opacity 2s ease';intro.style.opacity='0';intro.style.pointerEvents='none';
    setTimeout(()=>{intro.style.display='none';enableGame();},2000);
  }
  intro.addEventListener('click',startGame);
  intro.addEventListener('touchstart',e=>{e.preventDefault();startGame();},{passive:false});
  const flash=document.getElementById('flash'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),voltar=document.getElementById('voltar'),quote=document.getElementById('quote');
  setTimeout(()=>{voltar.style.opacity='1';voltar.style.pointerEvents='auto';},10000);
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const breathPeriod=8000;
  const baseRadius=()=>Math.min(canvas.width,canvas.height)*0.32;
  const breathAmplitude=()=>baseRadius()*0.12;
  let count=30,pressing=false,lastTick=null,elapsed=0,leaving=false,quoteVisible=false;
  function updateQuote(){const s=(count<=20&&count>10);if(s&&!quoteVisible){quote.style.opacity='1';quoteVisible=true;}else if(!s&&quoteVisible){quote.style.opacity='0';quoteVisible=false;}}
  function getRadius(t){const phase=(t%breathPeriod)/breathPeriod;const s=(Math.sin(phase*Math.PI*2-Math.PI/2)+1)/2;return baseRadius()-breathAmplitude()/2+s*breathAmplitude();}
  function triggerExit(href){if(leaving)return;leaving=true;if(!muted)fadeOutAudio();flash.style.opacity='1';setTimeout(()=>window.location.href=href,4000);}
  function isOnVoltar(x,y){const r=voltar.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
  function draw(ts){if(!lastTick)lastTick=ts;const delta=ts-lastTick;lastTick=ts;elapsed+=delta;if(pressing){count=Math.max(0,count-delta/1000);}else{count=Math.min(30,count+delta/1000);}if(count<=0)triggerExit('../');updateQuote();const cx=canvas.width/2,cy=canvas.height/2,r=getRadius(elapsed);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(30,28,25,0.75)';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='rgba(30,28,25,0.75)';ctx.font='2.2rem "VeteranTypewriter", serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.ceil(count),cx,cy);requestAnimationFrame(draw);}
  function enableGame(){canvas.style.pointerEvents='auto';document.addEventListener('mousedown',(e)=>{if(!isOnVoltar(e.clientX,e.clientY))pressing=true;});document.addEventListener('mouseup',()=>pressing=false);document.addEventListener('mouseleave',()=>pressing=false);document.addEventListener('touchstart',(e)=>{const t=e.touches[0];if(isOnVoltar(t.clientX,t.clientY)){triggerExit('../');}else{e.preventDefault();pressing=true;}},{passive:false});document.addEventListener('touchend',(e)=>{e.preventDefault();pressing=false;},{passive:false});document.addEventListener('touchcancel',()=>pressing=false);}
  voltar.addEventListener('click',function(e){e.preventDefault();triggerExit(this.href);});
  document.fonts.ready.then(()=>{requestAnimationFrame(draw);requestAnimationFrame(()=>flash.style.opacity='0');setTimeout(showIntro,800);});
</script>
</body>
</html>
